{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIT TechHub | Innovate. Develop. Grow.</title>
    <!-- Tumia Google Fonts kwa muonekano wa kimataifa -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo-container">
            <img src="{% static 'images/logo.png' %}" alt="TIT TechHub Logo" class="logo">
        </div>
        <ul class="nav-links">
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'about' %}">About Us</a></li>
            <li><a href="{% url 'services' %}">Services</a></li>
            <li><a href="#contact" class="btn-contact">Contact Us</a></li>
        </ul>
    </nav>

    <!-- Content ya kurasa tofauti itaingia hapa -->
    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 TIT TechHub. All rights reserved.</p>
        <p>Email: tittechhub.official@gmail.com</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
